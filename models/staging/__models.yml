version: 2

models:
  - name: stg_customers
    description: "Staging table for customers"
    columns:
      - name: client_id
        data_tests:
          - not_null
          - unique
      - name: email
        data_tests:
          - not_null:
              config:
                severity: warn
                store_failures: true
  - name: stg_orders
    columns:
      - name: commande_id
        data_tests:
          - not_null
          - unique
      - name: client_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: client_id
      - name: statut
        data_tests:
          - accepted_values:
              arguments:
                values: ["completed", "pending"]
