name: data_certification_formation

profile: data_certification_formation

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  data_certification_formation:
    +schema: raw

models:
  data_certification_formation:
    +persist_docs:
      relation: true
      columns: true
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: view
    marts:
      +materialized: table
